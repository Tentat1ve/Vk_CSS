<div class="pagination">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="page-nav prev">← Назад</a>
    {% endif %}
    
    <div class="page-numbers">
        {% for num in page_obj.paginator.page_range %}
            {% if num == page_obj.number %}
                <span class="page-number active">{{ num }}</span>
            {% else %}
                <a href="?page={{ num }}" class="page-number">{{ num }}</a>
            {% endif %}
        {% endfor %}
    </div>
    
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="page-nav next">Вперед →</a>
    {% endif %}
</div>
