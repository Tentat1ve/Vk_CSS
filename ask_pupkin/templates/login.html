{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | SODOM</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-container">                
                <div class="logo">
                    <span>SODOM</span>
                </div>
                <form class="search-form">
                    <input type="text" class="search-input" placeholder="Поиск по сайту...">
                    <button type="submit" class="search-button">
                    </button>
                </form>                
                
                <div class="user-block">
                    <div class="user-info">
                        <button class="user-avatar">Г</button>
                        <div class="user-name">Гость</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <h1 class="auth-title">Вход в аккаунт</h1>
            
            <form class="auth-form">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="your@email.com" maxlength="100" required>
                    <div class="form-hint">Введите ваш email адрес</div>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Пароль</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Введите пароль" maxlength="50" required>
                    <div class="form-hint">Минимум 6 символов</div>
                </div>

                <div class="form-error">
                    Неверный email или пароль. Проверьте правильность введенных данных.
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox">
                        <span class="checkmark"></span>
                        Запомнить меня
                    </label>
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Войти</button>

                <div class="auth-switch">
                    Нет аккаунта? <a href="signup.html">Зарегистрироваться</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
    </footer>
</body>
</html>
