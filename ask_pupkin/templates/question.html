<!-- В конец левой колонки, после списка ответов -->
{% if user.is_authenticated %}
<div class="answer-form-section" id="answer-form">
    <h3>Ваш ответ</h3>
    <form method="post" action="{% url 'qa:add_answer' question.id %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ answer_form.content.id_for_label }}" class="form-label">
                {{ answer_form.content.label }}
            </label>
            {{ answer_form.content }}
            {% if answer_form.content.errors %}
            <div class="form-error">{{ answer_form.content.errors.0 }}</div>
            {% endif %}
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Отправить ответ</button>
        </div>
    </form>
</div>
{% else %}
<div class="answer-form-section">
    <h3>Хотите ответить?</h3>
    <p>Пожалуйста, <a href="{% url 'qa:login' %}?next={{ request.path }}">войдите</a> или 
    <a href="{% url 'qa:signup' %}">зарегистрируйтесь</a>, чтобы оставить ответ.</p>
</div>
{% endif %}
